[project]
name = "stapi-fastapi"
version = "0.9.0"
description = "Sensor Tasking API (STAPI) with FastAPI"
authors = [
    { name = "Christian Wygoda", email = "christian.wygoda@wygoda.net" },
    { name = "Phil Varner", email = "phil@philvarner.com" },
    { name = "Jarrett Keifer", email = "jkeifer0@gmail.com" },
]
readme = "README.md"
license = "MIT"

requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10",
    "geojson-pydantic>=1.1",
    "returns>=0.23",
    "stapi-pydantic>=0.2.0",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27.0",  # used by the test client, not by the library
    "pytest>=8.3.5",
]

[tool.hatch.build.targets.sdist]
include = ["src/stapi_fastapi"]

[tool.hatch.build.targets.wheel]
include = ["src/stapi_fastapi"]

[tool.hatch.build.targets.wheel.sources]
"src/stapi_fastapi" = "stapi_fastapi"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
